<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <title>Portfolio - Shirin Nasr Esfahani</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Portfolio of Shirin Nasr Esfahani featuring UAV-based photogrammetry, bridge digital twins, 3D reconstruction, point-cloud processing, RGB-LiDAR registration, and RGB-sonar alignment."
  >

  <link href="css/bootstrap.css" rel="stylesheet">
  <link href="css/bootstrap-responsive.css" rel="stylesheet">

  <style type="text/css">

    * {
      box-sizing: border-box;
    }

    body {
      padding-top: 20px;
      padding-bottom: 40px;
      background-color: #ffffff;
      color: #000000;
    }

    .container-narrow {
      width: 100%;
      max-width: 1220px;
      margin: 0 auto;
      background-color: #ffffff;
    }

    .container-narrow > hr {
      margin: 30px 0;
    }

    .masthead:after {
      display: table;
      clear: both;
      content: "";
    }

    .project-section {
      margin-bottom: 50px;
    }

    .project-title {
      margin-top: 0;
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .project-description {
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.55;
      text-align: justify;
    }

    .tools-line {
      margin-top: 12px;
      margin-bottom: 25px;
      font-size: 14px;
      line-height: 1.55;
      text-align: justify;
    }

    /*
      Two-column layout for grouped figures
    */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
      margin: 22px auto 0 auto;
    }

    .figure-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      margin: 0;
      padding: 6px;
      border: 1px solid #777777;
      background-color: #ffffff;
      text-align: center;
    }

    .figure-card img {
      display: block;
      width: 100%;
      height: 360px;
      margin: 0 auto;
      object-fit: contain;
      background-color: #ffffff;
    }

    .panel-label {
      margin: 7px 0 2px 0;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.35;
      text-align: center;
    }

    .figure-caption {
      width: 100%;
      max-width: 1150px;
      margin: 10px auto 38px auto;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    /*
      Full-width figures
    */
    .single-figure {
      width: 100%;
      margin: 25px auto 40px auto;
      text-align: center;
    }

    .single-figure img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .single-figure figcaption {
      width: 100%;
      max-width: 1150px;
      margin: 8px auto 0 auto;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .section-divider {
      margin: 45px 0;
    }

    .copyright {
      margin-top: 30px;
      text-align: center;
    }

    /*
      Mobile / tablet layout
    */
    @media (max-width: 768px) {

      body {
        padding-right: 12px;
        padding-left: 12px;
      }

      .nav-pills.pull-right {
        float: none;
        margin-top: 10px;
      }

      .portfolio-grid {
        grid-template-columns: 1fr;
      }

      .figure-card img {
        height: auto;
        max-height: none;
      }

      .tools
